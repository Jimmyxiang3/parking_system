<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>停车楼API测试面板</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Microsoft YaHei',sans-serif;background:#1a1a2e;color:#eee;padding:20px;min-height:100vh}
h1{text-align:center;color:#e94560;margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(400px,1fr));gap:16px;max-width:1200px;margin:0 auto}
.card{background:#16213e;border-radius:10px;padding:16px;border:1px solid #0f3460}
.card h3{color:#e94560;margin-bottom:10px;font-size:15px}
.card label{display:block;font-size:12px;color:#aaa;margin-top:6px}
.card input,.card select{width:100%;padding:6px 10px;background:#0f3460;border:1px solid #533483;color:#fff;border-radius:5px;margin-top:3px;font-size:13px}
.card button{width:100%;padding:8px;margin-top:10px;background:#e94560;color:#fff;border:none;border-radius:5px;cursor:pointer;font-size:14px;font-weight:bold}
.card button:hover{background:#c73652}
.result{background:#0d1117;border-radius:5px;padding:8px 12px;margin-top:8px;max-height:300px;overflow:auto;font-size:12px;font-family:Consolas,monospace;white-space:pre-wrap;color:#58a6ff}
</style>
</head>
<body>
<h1>停车楼API测试面板</h1>
<div class="grid">

<div class="card">
<h3>车辆入场 (POST /api/vehicle/entry)</h3>
<label>车牌号</label><input id="entry_plate" value="鄂A88888">
<label>车辆类型</label>
<select id="entry_type">
<option value="normal">普通</option>
<option value="electric">电车</option>
<option value="special">专用</option>
<option value="ambulance">救护车</option>
<option value="fire_truck">消防车</option>
</select>
<label>车辆大小</label>
<select id="entry_size"><option>medium</option><option>small</option><option>large</option></select>
<label><input type="checkbox" id="entry_charging"> 需要充电</label>
<button onclick="testEntry()">车辆入场</button>
<div class="result" id="entry_result">等待请求...</div>
</div>

<div class="card">
<h3>车辆离场 (POST /api/vehicle/exit)</h3>
<label>车牌号</label><input id="exit_plate" value="鄂A88888">
<button onclick="testExit()">车辆离场</button>
<div class="result" id="exit_result">等待请求...</div>
</div>

<div class="card">
<h3>A*寻路 (GET /api/path/find)</h3>
<label>楼层限制</label><input id="path_floor" value="7" type="number">
<label><input type="checkbox" id="path_charging"> 仅充电车位</label>
<label><input type="checkbox" id="path_special"> 仅专用车位</label>
<button onclick="testPath()">开始寻路</button>
<div class="result" id="path_result">等待请求...</div>
</div>

<div class="card">
<h3>快捷GET测试</h3>
<button onclick="getJson('/api/spots','spots_result')">车位列表</button>
<button onclick="getJson('/api/analysis/occupancy','spots_result')" style="margin-top:4px">各层占用率</button>
<button onclick="getJson('/api/path/graph-info','spots_result')" style="margin-top:4px">路网图信息</button>
<button onclick="getJson('/api/user/profiles','spots_result')" style="margin-top:4px">用户画像列表</button>
<div class="result" id="spots_result">等待请求...</div>
</div>

</div>

<script>
const BASE = '';

async function testEntry() {
  const data = {
    plate_number: document.getElementById('entry_plate').value,
    vehicle_type: document.getElementById('entry_type').value,
    vehicle_size: document.getElementById('entry_size').value,
    is_electric: document.getElementById('entry_type').value === 'electric',
    need_charging: document.getElementById('entry_charging').checked,
  };
  const r = await fetch(BASE+'/api/vehicle/entry', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
  const entryData = await r.json();
  // 自动确认第1个车位
  if (entryData.code === 200 && entryData.data.assignment_id) {
    const aid = entryData.data.assignment_id;
    const c = await fetch(BASE+'/api/assignment/'+aid+'/confirm', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({selected_option:1})});
    const confirmData = await c.json();
    document.getElementById('entry_result').textContent = '【入场+确认】\n' + JSON.stringify({entry: entryData.data, confirm: confirmData.data}, null, 2);
  } else {
    document.getElementById('entry_result').textContent = JSON.stringify(entryData, null, 2);
  }
}

async function testExit() {
  const data = { plate_number: document.getElementById('exit_plate').value };
  const r = await fetch(BASE+'/api/vehicle/exit', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
  document.getElementById('exit_result').textContent = JSON.stringify(await r.json(),null,2);
}

async function testPath() {
  const params = new URLSearchParams({
    max_floor: document.getElementById('path_floor').value,
    only_charging: document.getElementById('path_charging').checked,
    only_special: document.getElementById('path_special').checked
  });
  const r = await fetch(BASE+'/api/path/find?'+params);
  document.getElementById('path_result').textContent = JSON.stringify(await r.json(),null,2);
}

async function getJson(url, elemId) {
  const r = await fetch(BASE+url);
  document.getElementById(elemId).textContent = JSON.stringify(await r.json(),null,2);
}
</script>
</body>
</html>
