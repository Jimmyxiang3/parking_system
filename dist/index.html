<body>
  <noscript>
    <strong>We're sorry but 智慧行政服务设施数字能源可视化平台 doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
  </noscript>
  <div id="app"></div>
  <script>
    (function adapt() {
      var app = document.getElementById('app');
      if (!app) return setTimeout(adapt, 100);
      var W = 1920, H = 925;
      function resize() {
        var w = window.innerWidth, h = window.innerHeight;
        var rot = (w < h && w < 1500);
        if (rot) { var t = w; w = h; h = t; }
        var s = Math.min(w / W, h / H);
        app.style.width = W + 'px';
        app.style.height = H + 'px';
        app.style.transformOrigin = '0 0';
        app.style.transform = (rot ? 'rotate(90deg) ' : '') + 'scale(' + s + ')';
      }
      window.addEventListener('resize', resize);
      window.addEventListener('orientationchange', function() { setTimeout(resize, 300); });
      resize();
    })();
  </script>
