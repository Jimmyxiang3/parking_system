<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            border: 0;
            box-sizing: border-box;
            font-size: 24px;
        }

        .wrap {
            width: 500px;
            height: 400px;
            /* background-color: rgba(36, 28, 28, 0.582); */
            background: url("./images/background.png") no-repeat;
            background-size: 100% 100%;
            /* border: 1px #ccc solid; */
            padding: 60px;
            position: relative;
            /* background-color: aliceblue; */
        }

        .wrap::after {
            content: "";
            display: block;
            width: 50px;
            height: 50px;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            bottom: -15px;
            background: url("images/jiantou.png") no-repeat;
            background-size: 100% 100%;
        }

        .title {
            color: rgb(120, 139, 108);
            background: url("./images/层_tit_bg.png") no-repeat;
            background-size: 100% 100%;
            width: 100%;
            display: flex;
            align-items: center;
            box-sizing: border-box;
            padding-left: 50px;
            font-size: 30px;
            position: relative;
            margin-top: 0px;
            color: #fff;
            margin-bottom: 30px;
        }

        .id {
            margin-top: 10px;
            display: flex;
            align-items: center;
            margin-bottom: 5px;

        }

        .id>div:first-child {
            border-radius: 50%;
            width: 14px;
            height: 14px;

            background: rgba(96, 226, 215, 1);
            margin-right: 7px;
        }

        .id>div:last-child {
            /*font-style: 60px;*/

            letter-spacing: 1px;
            color: #ffffff;
            font-family: "OPPO";
            line-height: 32px;
        }
    </style>
</head>

<body>

<div class="wrap">
    <div class="title"></div>
    <div class="id">
        <div></div>
        <div>设备编号： HS202203120552</div>
    </div>
    <div class="id">
        <div></div>
        <div>进线电压：10kv</div>
    </div>
    <div class="id">
        <div></div>
        <div>出线电压：220v</div>
    </div>
    <div class="id">
        <div></div>
        <div>上次检修日期：2022年3月12日</div>
    </div>
    <div class="id">
        <div></div>
        <div>检修人：王修</div>
    </div>

</div>
    <script>

        var query = window.location.search.substring(1);
        var vars = query.split("&");
        let obj = {}
        vars.forEach(item => {
            let cur = item.split("=")
            console.log(cur);
            obj[cur[0]] = decodeURI(cur[1])
        })
        let { title } = obj
        document.querySelector(".title").innerHTML = obj.title;
    </script>
</body>

</html>
